spring.application.name=cyberguard-enterprise
server.port=${PORT:8080}

spring.datasource.url=${CYBERGUARD_DB_URL:jdbc:postgresql://${CYBERGUARD_DB_HOST:localhost}:${CYBERGUARD_DB_PORT:5432}/${CYBERGUARD_DB_NAME:cyberguard}}
spring.datasource.username=${CYBERGUARD_DB_USER:cyberguard}
spring.datasource.password=${CYBERGUARD_DB_PASSWORD:cyberguard}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Cambie estos valores en producción mediante variables de entorno
cyberguard.jwt.secret=${CYBERGUARD_JWT_SECRET:cambie-esta-clave-secreta-de-al-menos-32-caracteres-2026}
cyberguard.jwt.expiration-minutes=60
cyberguard.admin.username=${CYBERGUARD_ADMIN_USER:admin}
cyberguard.admin.password=${CYBERGUARD_ADMIN_PASSWORD:CambiaEsta#2026}
# Registro público de empresas (true/false) y máximo de intentos por hora y conexión
cyberguard.registration.enabled=${CYBERGUARD_REGISTRATION_ENABLED:true}
cyberguard.registration.max-per-hour=5
# Invitaciones por enlace/QR: altas máximas por hora y conexión (una oficina comparte dirección)
cyberguard.invitations.max-joins-per-hour=20
# Monitoreo: segundos sin señal antes de marcar un dispositivo como sin conexión, y límite de eventos por minuto
cyberguard.monitoring.offline-after-seconds=180
cyberguard.monitoring.check-interval-ms=30000
cyberguard.monitoring.max-events-per-minute=120
# Intentos fallidos de inicio de sesión (por conexión y sesión) antes de bloquear 15 minutos
cyberguard.security.max-login-failures=5
cyberguard.admin.company=${CYBERGUARD_COMPANY_NAME:Empresa Demo}
# Modo invitado (entrar solo para ver): sesión de solo consulta sobre la primera empresa. Ponga false para ocultarlo
cyberguard.guest.enabled=${CYBERGUARD_GUEST_ENABLED:true}
cyberguard.guest.username=${CYBERGUARD_GUEST_USER:invitado}
