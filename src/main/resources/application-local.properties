# Modo local: base de datos incorporada (H2), sin instalar PostgreSQL.
# Los datos se guardan en la carpeta ./data. Pensado para pruebas y uso local;
# para producción use PostgreSQL (perfil por defecto).
spring.datasource.url=jdbc:h2:file:./data/cyberguard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration-h2
